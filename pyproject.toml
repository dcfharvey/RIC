[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-social"
version = "0.1.0a4"
description = "Vivarium social artificiel — bac à sable social persistant et textuel."
requires-python = ">=3.12"
authors = [{ name = "Propriétaire du vivarium" }]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
