name: Sol temporary patch runner

on:
  push:
    branches:
      - chatgpt/dev-bridge-phase-a-final
    paths:
      - .sol-dev/patch.diff

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dev-bridge-phase-a-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        shell: pwsh
        run: git apply --check .sol-dev/patch.diff; git apply .sol-dev/patch.diff
      - name: Install test dependency
        shell: pwsh
        run: python -m pip install pytest
      - name: Targeted tests
        shell: pwsh
        run: python -m pytest tests/test_dev_bridge.py tests/test_dev_bridge_sol_hardening.py -q
      - name: Full suite
        shell: pwsh
        run: python -m pytest -q
      - name: Diff check
        shell: pwsh
        run: git diff --check
      - name: Commit patched sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vivarium/dev_bridge.py tests/test_dev_bridge_sol_hardening.py
          git commit -m "fix: harden bridge traversal and log tails"
          git push origin HEAD:chatgpt/dev-bridge-phase-a-final
