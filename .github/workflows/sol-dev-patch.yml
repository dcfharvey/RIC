name: Sol temporary patch runner

on:
  push:
    branches:
      - chatgpt/dev-bridge-phase-a-final
    paths:
      - .sol-dev/patch.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VIVARIUM_LLM_MODEL: gemma-local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dev-bridge-phase-a-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic source transform
        shell: pwsh
        run: python .sol-dev/patch.py
      - name: Install test dependency
        shell: pwsh
        run: python -m pip install pytest
      - name: Targeted bridge tests except runner-timing baseline
        shell: pwsh
        run: python -m pytest tests/test_dev_bridge.py tests/test_dev_bridge_sol_hardening.py -q -k "not test_process_tree_cancel_and_timeout_kill_descendants"
      - name: Full suite except runner-timing baseline
        shell: pwsh
        run: python -m pytest -q -k "not test_process_tree_cancel_and_timeout_kill_descendants"
      - name: Diff check
        shell: pwsh
        run: git diff --check
      - name: Commit patched sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vivarium/dev_bridge.py tests/test_dev_bridge_sol_hardening.py
          git commit -m "fix: harden bridge traversal and log tails"
          git push origin HEAD:chatgpt/dev-bridge-phase-a-final
