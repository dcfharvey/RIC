name: WO86 normalize schema expectations

on:
  push:
    branches:
      - chatgpt/wo86-synthetic-causal-guard

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'advance schema expectations to 55')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/wo86-synthetic-causal-guard
          fetch-depth: 0

      - name: Update only current-schema assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'tests/test_action_arbitration_foundation.py',
              'tests/test_activity_physiology_metadata.py',
              'tests/test_admin_changes.py',
              'tests/test_bench.py',
              'tests/test_initial_physiology_manifest.py',
              'tests/test_physical_capacity_policy.py',
              'tests/test_scc1c_admission.py',
              'tests/test_sleep_physiology_foundation.py',
              'tests/test_sleep_physiology_persistence.py',
              'tests/test_sleep_termination_foundation.py',
              'tests/test_social_cognition_runtime.py',
              'tests/test_social_interpretation.py',
              'tests/test_social_interpretation_provider.py',
              'tests/test_social_speech_memory.py',
          ]
          changed = []
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              updated = text.replace('ensure_schema(conn) == 54', 'ensure_schema(conn) == 55')
              updated = updated.replace('report.schema_version == 54', 'report.schema_version == 55')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(name)
          print('updated:', *changed, sep='\n  ')
          PY

      - name: Verify no stale current-schema assertion remains
        run: |
          if grep -R -n -E 'ensure_schema\(conn\) == 54|report\.schema_version == 54' tests; then
            echo 'stale current-schema assertion remains' >&2
            exit 1
          fi

      - name: Commit exact expectation bump if needed
        run: |
          if git diff --quiet -- tests; then
            echo 'No schema expectation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'test: advance schema expectations to 55'
          git push origin HEAD:chatgpt/wo86-synthetic-causal-guard
