name: WO86 normalize schema expectations

on:
  push:
    branches:
      - chatgpt/wo86-synthetic-causal-guard

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'advance schema expectations to 55')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/wo86-synthetic-causal-guard
          fetch-depth: 0

      - name: Update only current-schema assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/test_admin_changes.py': [
                  ('current_version(conn) == 54', 'current_version(conn) == 55'),
              ],
              'tests/test_social_interpretation.py': [
                  ('ensure_schema(reopened) == 54', 'ensure_schema(reopened) == 55'),
              ],
              'tests/test_social_interpretation_provider.py': [
                  ('ensure_schema(reopened) == 54', 'ensure_schema(reopened) == 55'),
              ],
          }
          changed = []
          for name, rules in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in rules:
                  if old not in updated:
                      raise SystemExit(f'expected stale assertion not found: {name}: {old}')
                  updated = updated.replace(old, new, 1)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(name)
          print('updated:', *changed, sep='\n  ')
          PY

      - name: Verify repaired assertions
        run: |
          grep -n 'current_version(conn) == 55' tests/test_admin_changes.py
          grep -n 'ensure_schema(reopened) == 55' tests/test_social_interpretation.py
          grep -n 'ensure_schema(reopened) == 55' tests/test_social_interpretation_provider.py

      - name: Commit exact expectation bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git diff --cached --check
          git commit -m 'test: advance schema expectations to 55'
          git push origin HEAD:chatgpt/wo86-synthetic-causal-guard
