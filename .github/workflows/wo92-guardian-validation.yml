name: WO92 Guardian validation

on:
  push:
    branches:
      - chatgpt/wo92-guardian-debloat-ci

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pytest>=8"
      - name: Targeted Guardian tests
        run: python -m pytest -q tests/test_guardian.py tests/test_mvp_preflight.py
      - name: Full suite
        run: python -m pytest -q
