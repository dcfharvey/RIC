name: WO88 disposable build

on:
  push:
    branches:
      - chatgpt/wo88-build
    paths:
      - tools/wo88_apply.py
      - tools/wo88_fix.py
      - .github/workflows/wo88-build.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo88-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: |
          python tools/wo88_apply.py
          python tools/wo88_fix.py
      - name: Install
        run: python -m pip install -e . pytest
      - name: Targeted tests
        run: python -m pytest -q tests/test_active_physical_capacity.py tests/test_physical_capacity_policy.py tests/test_synthetic_action_arbitration.py tests/test_sleep_physiology_persistence.py
      - name: Commit generated candidate
        shell: pwsh
        run: |
          git config user.name "RIC WO88 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "wo88: generated active runtime patch"
          git push origin HEAD:chatgpt/wo88-build
