name: WO88F disposable build

on:
  push:
    branches:
      - chatgpt/wo88f-build
    paths:
      - tools/wo88f_apply.py
      - tools/wo88f_fix.py
      - .github/workflows/wo88f-build.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo88f-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: |
          python tools/wo88f_apply.py
          python tools/wo88f_fix.py
      - name: Install
        run: python -m pip install -e . pytest
      - name: Targeted tests
        run: >-
          python -m pytest -q
          tests/test_physiology_activation.py
          tests/test_initial_physiology_manifest.py
          tests/test_sleep_physiology_persistence.py
          tests/test_physical_capacity_policy.py
          tests/test_sleep_termination_foundation.py
          tests/test_mvp_preflight.py
      - name: Commit generated candidate
        shell: pwsh
        run: |
          git config user.name "RIC WO88 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "wo88f: generated atomic physiology activation patch"
          git push origin HEAD:chatgpt/wo88f-build
