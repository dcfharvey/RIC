# Temporary validation only; remove before handoff.
name: Temporary branch pytest

on:
  push:
    branches:
      - chatgpt/wo86-synthetic-causal-guard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIVARIUM_LLM_MODEL: ci-dummy-model
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile changed package
        run: python -m compileall -q src/vivarium
      - name: Run targeted regression tests
        run: >-
          python -m pytest -q
          tests/test_migrations.py
          tests/test_synthetic_action_arbitration.py
          tests/test_synthetic_causal_arbitration.py
          tests/test_synthetic_causal_arbitration_guards.py
          tests/test_synthetic_sleep_integration.py
