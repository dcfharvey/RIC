# Temporary validation only; remove before handoff.
name: Temporary branch pytest

on:
  push:
    branches:
      - chatgpt/wo86-synthetic-causal-guard

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIVARIUM_LLM_MODEL: ci-dummy-model
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Repair exact test field
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_synthetic_sleep_integration.py")
          text = path.read_text(encoding="utf-8")
          old = "authorization.authorization_id"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one stale field reference, got {text.count(old)}")
          path.write_text(text.replace(old, "authorization.id"), encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate before commit
        run: |
          python -m compileall -q src/vivarium
          git diff --check
          python -m pytest -q \
            tests/test_migrations.py \
            tests/test_synthetic_action_arbitration.py \
            tests/test_synthetic_causal_arbitration.py \
            tests/test_synthetic_causal_arbitration_guards.py \
            tests/test_synthetic_sleep_integration.py
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_synthetic_sleep_integration.py
          git commit -m "test: fix stale authorization assertion"
          git push
