# Temporary validation only; remove before handoff.
name: Temporary branch pytest

on:
  push:
    branches:
      - chatgpt/wo86-synthetic-causal-guard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-final-schema-expectations:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: apply final schema 55 repairs' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair exact remaining expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "current_version(conn) == 54": "current_version(conn) == 55",
              "ensure_schema(reopened) == 54": "ensure_schema(reopened) == 55",
          }
          changed = []
          total = 0
          for path in sorted(Path("tests").rglob("*.py")):
              original = path.read_text(encoding="utf-8")
              updated = original
              count = 0
              for old, new in replacements.items():
                  found = updated.count(old)
                  updated = updated.replace(old, new)
                  count += found
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append((str(path), count))
                  total += count
          if total != 3:
              raise SystemExit(f"Expected exactly 3 repairs, got {total}: {changed}")
          print(changed)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git diff --cached --check
          git commit -m "test: finish schema 55 expectation updates"
          git push

  pytest:
    if: "${{ github.event_name != 'push' || github.event.head_commit.message != 'ci: apply final schema 55 repairs' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIVARIUM_LLM_MODEL: ci-dummy-model
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
