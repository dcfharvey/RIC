# Temporary validation only; remove before handoff.
name: Temporary branch pytest

on:
  push:
    branches:
      - chatgpt/wo86-synthetic-causal-guard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIVARIUM_LLM_MODEL: ci-dummy-model
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
