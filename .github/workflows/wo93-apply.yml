name: WO93 apply scaffolding debloat
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage WO93 scaffolding debloat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo93-debloat-scaffolding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove obsolete qualification scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          def remove_top_level_defs(path, names):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              tree = ast.parse(text)
              ranges = []
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.name in names:
                      start = node.lineno - 1
                      while start > 0 and lines[start-1].strip() == '':
                          start -= 1
                      ranges.append((start, node.end_lineno))
              missing = set(names) - {node.name for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.name in names}
              if missing:
                  raise SystemExit(f'{path}: missing defs {sorted(missing)}')
              keep = [True] * len(lines)
              for start, end in ranges:
                  for i in range(start, end): keep[i] = False
              p.write_text(''.join(line for i, line in enumerate(lines) if keep[i]), encoding='utf-8')

          cli = Path('src/vivarium/cli.py')
          remove_top_level_defs(cli, {
              '_run_llm_smoke', '_run_living_bench', '_run_llm_calibration',
              '_run_sleep_calibration_bench', '_run_social_interpretation_bench',
              '_run_llm_inventory', '_run_social_interpretation_screen',
              '_run_scene_smoke', '_run_scene_bench',
          })
          text = cli.read_text(encoding='utf-8')
          start = text.index('    p_smoke = sub.add_parser(')
          end = text.index('    p_preflight = sub.add_parser(', start)
          text = text[:start] + text[end:]
          start = text.index('    if args.command == "llm-smoke":')
          end = text.index('    if args.command == "mvp-preflight":', start)
          text = text[:start] + text[end:]
          cli.write_text(text, encoding='utf-8')

          test_cli = Path('tests/test_cli.py')
          remove_top_level_defs(test_cli, {
              'test_cli_screen_instantiates_real_scc_provider_without_network',
              'test_cli_screen_default_report_namespace_is_stable',
              'test_cli_screen_custom_reports_use_distinct_atomic_namespaces',
              'test_cli_llm_smoke_reports_a_healthy_ephemeral_run',
              'test_cli_llm_calibrate_reports_a_healthy_ephemeral_series',
              'test_cli_scene_smoke_reports_a_healthy_ephemeral_turn',
              'test_cli_scene_bench_reports_a_healthy_ephemeral_conversation',
          })
          text = test_cli.read_text(encoding='utf-8')
          text = text.replace('from vivarium.cognition import LocalLLMSettings\n', '')
          text = text.replace('from vivarium.social_interpretation_provider import LMStudioSocialInterpretationProvider\n', '')
          test_cli.write_text(text, encoding='utf-8')

          sched = Path('tests/test_scene_scheduler.py')
          remove_top_level_defs(sched, {'Provider', 'test_scene_bench_is_ephemeral_and_stops_at_its_turn_bound'})
          text = sched.read_text(encoding='utf-8')
          for line in (
              'from vivarium.cognition_policy import CognitionCallLimits\n',
              'from vivarium.scene_bench import run_scene_bench\n',
              'from vivarium.scene_turn import SceneTurnDecision\n',
          ):
              text = text.replace(line, '')
          sched.write_text(text, encoding='utf-8')
          PY

          git rm \
            .github/workflows/local-llm-smoke.yml \
            src/vivarium/cognition_call_bench.py \
            src/vivarium/cognition_smoke.py \
            src/vivarium/home_field_audit.py \
            src/vivarium/living_bench.py \
            src/vivarium/local_llm_calibration.py \
            src/vivarium/scene_bench.py \
            src/vivarium/scene_turn_smoke.py \
            src/vivarium/sleep_calibration.py \
            src/vivarium/social_attribution_mini_bench.py \
            src/vivarium/social_interpretation_bench.py \
            src/vivarium/circadian_shadow.py \
            tests/test_cognition_call_bench.py \
            tests/test_cognition_smoke.py \
            tests/test_home_field_audit.py \
            tests/test_living_bench.py \
            tests/test_local_llm_calibration.py \
            tests/test_scene_turn_smoke.py \
            tests/test_sleep_calibration.py \
            tests/test_social_interpretation_bench.py \
            tests/test_circadian_shadow.py
          git rm .github/workflows/wo93-apply.yml

          git config user.name 'RIC debloat bot'
          git config user.email 'noreply@github.com'
          git add src/vivarium/cli.py tests/test_cli.py tests/test_scene_scheduler.py
          git diff --cached --check
          git commit -m 'refactor: remove retired qualification scaffolding'
          git push origin HEAD:chatgpt/wo93-debloat-scaffolding
