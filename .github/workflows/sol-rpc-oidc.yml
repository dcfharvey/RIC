name: RIC Sol RPC OIDC v2

on:
  push:
    branches:
      - bridge/sol-rpc-v2
    paths:
      - .ric-bridge/request.json

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      request_json: ${{ steps.prepare.outputs.request_json }}
      request_id: ${{ steps.prepare.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .ric-bridge/request.json
          sparse-checkout-cone-mode: false
      - name: Read exact triggering request
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import uuid
          from pathlib import Path

          path = Path('.ric-bridge/request.json')
          raw = path.read_bytes()
          if not raw or len(raw) > 128 * 1024:
              raise RuntimeError('request too large')
          doc = json.loads(raw.decode('utf-8'))
          if not isinstance(doc, dict) or doc.get('schema_version') != 2:
              raise RuntimeError('request schema rejected')
          request_id = doc.get('request_id')
          parsed = uuid.UUID(request_id) if isinstance(request_id, str) else None
          if parsed is None or parsed.version != 4:
              raise RuntimeError('request_id must be UUID4')
          compact = json.dumps(doc, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          delimiter = 'RIC_REQUEST_JSON_EOF'
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'request_id={request_id}\n')
              handle.write(f'request_json<<{delimiter}\n{compact}\n{delimiter}\n')
          PY

  relay:
    needs: prepare
    uses: dcfharvey/RIC/.github/workflows/ric-dev-trusted.yml@2b4485c10b601b8d9adb79fc15c5f9d3807ee67c
    with:
      request_json: ${{ needs.prepare.outputs.request_json }}
    secrets:
      BASE_URL: ${{ secrets.RIC_LOCAL_LLM_BASE_URL }}

  publish:
    needs: [prepare, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT_B64: ${{ needs.relay.outputs.result_b64 }}
      EXPECTED_ID: ${{ needs.prepare.outputs.request_id }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RPC_BRANCH: bridge/sol-rpc-v2
    steps:
      - name: Publish immutable result by request id
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          encoded = os.environ.get('RESULT_B64', '')
          if not encoded or len(encoded) > 450 * 1024:
              raise RuntimeError('relay result missing or too large')
          raw = base64.b64decode(encoded, validate=True)
          result = json.loads(raw.decode('utf-8'))
          expected = os.environ['EXPECTED_ID']
          if not isinstance(result, dict) or result.get('schema_version') != 2 or result.get('request_id') != expected:
              raise RuntimeError('relay result identity mismatch')

          repo = os.environ['REPOSITORY']
          branch = os.environ['RPC_BRANCH']
          token = os.environ['GH_TOKEN']
          path = f'.ric-bridge/results/{expected}.json'
          api = 'https://api.github.com'

          def github(method, url_path, body=None):
              data = None if body is None else json.dumps(body, sort_keys=True, separators=(',', ':')).encode()
              request = urllib.request.Request(api + url_path, data=data, method=method, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  **({'Content-Type': 'application/json'} if data is not None else {}),
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          ref = urllib.parse.quote(branch, safe='')
          existing = None
          try:
              existing = github('GET', f'/repos/{repo}/contents/{path}?ref={ref}')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          if existing is not None:
              old = base64.b64decode(existing['content'].replace('\n', ''))
              if old == raw:
                  print(f'Result already published identically: {expected}')
                  raise SystemExit(0)
              raise RuntimeError('request_id result collision')

          body = {
              'message': f'bridge: oidc result {expected}',
              'content': base64.b64encode(raw).decode('ascii'),
              'branch': branch,
          }
          github('PUT', f'/repos/{repo}/contents/{path}', body)
          print(f'Published OIDC RPC result: {expected}')
          PY
