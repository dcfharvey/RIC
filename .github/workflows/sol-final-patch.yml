name: Sol deterministic final bridge patch

on:
  push:
    branches:
      - chatgpt/dev-bridge-final
    paths:
      - .sol-final/patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      VIVARIUM_LLM_MODEL: gemma-local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dev-bridge-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python .sol-final/patch.py
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_dev_bridge_control.py tests/test_bridge_repo_git.py -q
      - run: git diff --check
      - name: Commit deterministic patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vivarium/dev_bridge_auth.py bridge_control/ric_bridge_control.py tests/test_dev_bridge_control.py
          git commit -m "fix: bind bridge auth and writes to exact trust scope"
          git push origin HEAD:chatgpt/dev-bridge-final
