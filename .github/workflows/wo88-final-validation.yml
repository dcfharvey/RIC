name: WO88 final validation

on:
  push:
    branches:
      - chatgpt/wo88-final-validation
    paths:
      - .github/workflows/wo88-final-validation.yml

permissions:
  contents: read

jobs:
  full-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo88-final-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Full suite
        run: python -m pytest -q

# Sequential roadmap gate: rerun after hardening the hosted-runner descendant timeout proof.
