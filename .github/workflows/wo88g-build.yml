name: WO88G disposable preflight

on:
  push:
    branches:
      - chatgpt/wo88g-preflight-build
    paths:
      - tools/wo88g_apply.py
      - .github/workflows/wo88g-build.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo88g-preflight-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python tools/wo88g_apply.py
      - name: Install
        run: python -m pip install -e . pytest
      - name: Targeted tests
        run: >-
          python -m pytest -q
          tests/test_mvp_preflight.py
          tests/test_active_runtime_cutover.py
          tests/test_mvp_runtime.py
          tests/test_decision.py
          tests/test_sleep_physiology_persistence.py
      - name: Commit generated candidate
        shell: pwsh
        run: |
          git config user.name "RIC WO88 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "wo88g: accept validated active cutover in preflight"
          git push origin HEAD:chatgpt/wo88g-preflight-build
