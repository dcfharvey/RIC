name: Sol bridge final validation

on:
  push:
    branches:
      - chatgpt/dev-bridge-final

permissions:
  contents: read

jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      VIVARIUM_LLM_MODEL: gemma-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_dev_bridge_control.py tests/test_bridge_repo_git.py -q
      - run: python -m py_compile src/vivarium/dev_bridge_auth.py bridge_control/ric_bridge_control.py bridge_control/repo_git.py bridge_control/supervisor.py tools/install_ric_bridge_control.py
      - run: git diff --check

  full-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VIVARIUM_LLM_MODEL: gemma-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Full suite excluding known hosted-runner timing-only baseline
        run: python -m pytest -q -k "not test_process_tree_cancel_and_timeout_kill_descendants"
      - run: git diff --check
