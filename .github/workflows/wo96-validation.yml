name: WO96 CI validation
on:
  push:
    branches: [chatgpt/wo96-ci-validation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Targeted WO96/runtime tests
        run: >-
          python -m pytest -q
          tests/test_wo96_physiology_anchor.py
          tests/test_wo95_activity_gap.py
          tests/test_active_runtime_cutover.py
          tests/test_wo91.py
          tests/test_autonomy_cycle.py
          tests/test_mvp_runtime.py
          tests/test_activities.py
          tests/test_action_contract.py
      - name: Broad suite
        run: >-
          python -m pytest -q
          --deselect=tests/test_dev_bridge.py::test_exec_allowlist_shell_injection_timeout_output_cap_and_scoped_env
          --deselect=tests/test_dev_bridge.py::test_jobs_start_poll_cancel_and_concurrency_limit
          --deselect=tests/test_dev_bridge.py::test_process_tree_cancel_and_timeout_kill_descendants
          --deselect=tests/test_dev_bridge.py::test_git_surface_is_read_only_and_sees_untracked_workspace
