name: WO94 remove retired synthetic physiology path
on:
  push:
    branches: [chatgpt/wo94-debloat-physiology]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo94-debloat-physiology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply physiology cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          def node_start(node):
              starts=[node.lineno]
              starts += [d.lineno for d in getattr(node,'decorator_list',())]
              return min(starts)-1

          def remove_nodes(path, predicate):
              p=Path(path); text=p.read_text(encoding='utf-8'); lines=text.splitlines(keepends=True); tree=ast.parse(text)
              ranges=[]
              for node in ast.walk(tree):
                  if predicate(node):
                      start=node_start(node)
                      while start>0 and not lines[start-1].strip(): start-=1
                      ranges.append((start,node.end_lineno))
              # Keep only outermost ranges; deleting a class/method must not double-delete nested nodes.
              merged=[]
              for a,b in sorted(ranges):
                  if merged and a >= merged[-1][0] and b <= merged[-1][1]: continue
                  if merged and a <= merged[-1][1]: merged[-1]=(merged[-1][0],max(merged[-1][1],b))
                  else: merged.append((a,b))
              keep=[True]*len(lines)
              for a,b in merged:
                  for i in range(a,b): keep[i]=False
              p.write_text(''.join(x for i,x in enumerate(lines) if keep[i]),encoding='utf-8')
              return len(merged)

          sleep=Path('src/vivarium/sleep_physiology.py')
          remove_classes={'InitialPhysiologyState','SyntheticMaterialization','SyntheticRegulationSegment'}
          remove_methods={
              'validate_initial_states','resolve_light_source_synthetic','project_synthetic',
              '_capacity_rate_milli_per_hour','_advance_capacity','materialize_synthetic',
              'materialize_segments_synthetic','next_critical_boundary_synthetic',
          }
          def sleep_pred(node):
              if isinstance(node,ast.ClassDef) and node.name in remove_classes: return True
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in remove_methods: return True
              return False
          removed=remove_nodes(sleep,sleep_pred)
          if removed < len(remove_classes)+len(remove_methods):
              raise SystemExit(f'expected at least {len(remove_classes)+len(remove_methods)} physiology nodes, removed {removed}')
          text=sleep.read_text(encoding='utf-8')
          text=text.replace('SYNTHETIC_INTEGRATION_QUANTUM_SECONDS','INTEGRATION_QUANTUM_SECONDS')
          text=text.replace('''"""Fondations canoniques inactives de la physiologie veille-sommeil.\n\nCe module possède les registres de lumière, les profils biologiques et la\npréparation technique d'un futur cutover. Son raccord persistant peut relire\ndes états et projeter le noyau sélectionné, mais n'ouvre aucune activité,\nn'intègre aucun intervalle et n'est volontairement appelé par aucun cycle\nruntime : tant que ``world_physiology_system`` n'est pas cut over dans un lot\nultérieur, le monde conserve intégralement son comportement legacy.\n\nLa phase circadienne sera le premier état intégrateur de l'histoire lumineuse.\nSi la fonction quantitative retenue exige davantage d'histoire récente, elle\ndevra soit la reconstruire depuis les causes canoniques, soit ajouter un état\nintégrateur minimal owned par ce service. Une lecture ne pourra jamais créer\ncette histoire rétroactivement.\n"""''','''"""Physiologie veille-sommeil persistante et owner-backed.\n\nLe module possède les profils, l'état H/phi/P et leur matérialisation active.\nLes causes runtime sont relues depuis les owners canoniques; aucun appelant ne\npeut injecter librement une cause physiologique persistante.\n"""''')
          text=text.replace('''class SleepPhysiologyService:\n    """Raccord persistant, déterministe et encore sans branchement runtime.\n\n    Le service est le seul lecteur normalisé des états H/phase/P et de la\n    mémoire d'hystérésis. Il n'expose aucune activation, aucune intégration et\n    aucune écriture : ces opérations appartiennent à des lots ultérieurs et\n    restent bloquées tant que le cutover atomique n'est pas approuvé.\n    """''','''class SleepPhysiologyService:\n    """Owner runtime déterministe des états H/phase/P et de leur hystérésis."""''')
          text=text.replace('''        Contrairement a ``resolve_light_source_synthetic``, l'appelant ne peut\n        fournir ni lieu, ni etat, ni occlusion, ni stimulation. ``at_time``\n        represente une frontiere explicite; ``canonical_event_seq`` en est le\n        jeton de contexte pour une reutilisation apres raisonnement externe.\n        Cette API est un contrat futur/preflight et n'est appelee par aucun\n        runtime dans ce lot.\n''','''        L'appelant ne peut fournir ni lieu, ni état physiologique libre.\n        ``at_time`` représente une frontière explicite; ``canonical_event_seq``\n        en est le jeton de contexte pour une réutilisation après raisonnement.\n''')
          sleep.write_text(text,encoding='utf-8')

          # Remove retired synthetic-only persistence tests; owner-backed coverage remains elsewhere.
          p=Path('tests/test_sleep_physiology_persistence.py'); text=p.read_text(encoding='utf-8'); tree=ast.parse(text)
          tokens=(
              'resolve_light_source_synthetic','project_synthetic','materialize_synthetic',
              'materialize_segments_synthetic','next_critical_boundary_synthetic','SyntheticRegulationSegment',
          )
          ranges=[]
          for node in tree.body:
              if isinstance(node,ast.FunctionDef) and node.name.startswith('test_'):
                  segment=''.join(text.splitlines(True)[node.lineno-1:node.end_lineno])
                  if any(tok in segment for tok in tokens): ranges.append(node.name)
          remove_nodes(p,lambda n:isinstance(n,ast.FunctionDef) and n.name in set(ranges))
          text=p.read_text(encoding='utf-8')
          text=text.replace('    RegulationInput,\n','').replace('    advance_regulation,\n','').replace('    effective_light_drive,\n','')
          text=text.replace('    SyntheticRegulationSegment,\n','')
          text=text.replace('"""Raccord persistant inactif : lectures, gate et ownership."""','"""Raccord persistant owner-backed : lectures, gate et ownership."""')
          p.write_text(text,encoding='utf-8')
          # Drop helper functions left with no callers after removing the synthetic trajectories.
          for helper in ('_physiology_snapshot','_set_synthetic_state'):
              text=p.read_text(encoding='utf-8')
              if text.count(helper)==1:
                  remove_nodes(p,lambda n:isinstance(n,ast.FunctionDef) and n.name==helper)

          p=Path('tests/test_sleep_physiology_foundation.py')
          remove_nodes(p,lambda n:isinstance(n,ast.FunctionDef) and n.name=='test_initial_state_validation_is_read_only_and_requires_every_character')
          text=p.read_text(encoding='utf-8').replace('    InitialPhysiologyState,\n','')
          text=text.replace('"""Fondations inactives du futur domaine circadien/veille-sommeil."""','"""Fondations et configuration de la physiologie veille-sommeil."""')
          p.write_text(text,encoding='utf-8')

          # The old falsification monkeypatch becomes a stronger structural invariant: the API is absent.
          p=Path('tests/test_active_runtime_cutover.py')
          remove_nodes(p,lambda n:isinstance(n,ast.FunctionDef) and n.name=='test_active_runtime_paths_do_not_call_public_synthetic_physiology_apis')
          with p.open('a',encoding='utf-8') as f:
              f.write('''\n\ndef test_active_runtime_exposes_no_public_synthetic_physiology_apis():\n assert not hasattr(SleepPhysiologyService, "project_synthetic")\n assert not hasattr(SleepPhysiologyService, "next_critical_boundary_synthetic")\n assert not hasattr(SleepPhysiologyService, "materialize_synthetic")\n''')

          # Sleep termination is active now; remove stale future-cutover wording only.
          p=Path('src/vivarium/sleep_termination.py'); text=p.read_text(encoding='utf-8')
          text=text.replace('''"""Contrats inactifs de checkpoints et de terminaison du sommeil.\n\nLa politique est une calibration d'ingenierie versionnee. L'evaluateur pur ne\nlit ni les besoins legacy ni SQLite : dans un raccord futur, les entrees de\nviabilite devront venir du proprietaire physiologique et un reveil externe\ndevra etre prouve par le moteur avant d'etre transmis ici. Aucun resultat de\nce module ne complete, n'interrompt ou ne reveille une activite par lui-meme.\n"""''','''"""Checkpoints et terminaison owner-backed du sommeil.\n\nLa politique est une calibration d'ingénierie versionnée. L'évaluateur pur ne\nlit ni les besoins legacy ni SQLite; la viabilité vient du propriétaire\nphysiologique et les transitions canoniques restent appliquées par le moteur.\n"""''')
          text=text.replace('''    ``wake_viability_milli`` est une projection future du proprietaire\n    physiologique, pas une lecture libre par cognition. L'argument de reveil\n    externe n'existe ici que pour le banc : le raccord production devra le\n    remplacer par une cause canonique accessible et validee.\n''','''    ``wake_viability_milli`` est une projection du propriétaire physiologique,\n    pas une lecture libre par cognition. Un réveil externe reste refusé tant\n    qu'aucun owner canonique ne fournit cette cause accessible.\n''')
          p.write_text(text,encoding='utf-8')
          PY

          git rm src/vivarium/synthetic_sleep_integration.py tests/test_synthetic_sleep_integration.py
          git rm .github/workflows/wo94-callgraph-audit.yml .github/workflows/wo94-test-classification.yml .github/workflows/wo94-sleep-coverage-audit.yml .github/workflows/wo94-physiology-audit.yml .github/workflows/wo94-physiology-apply.yml
          git config user.name 'RIC debloat bot'
          git config user.email 'noreply@github.com'
          git add src tests
          git diff --cached --check
          python -m compileall -q src tests
          git commit -m 'refactor: remove retired synthetic physiology path'
          git push origin HEAD:chatgpt/wo94-debloat-physiology
