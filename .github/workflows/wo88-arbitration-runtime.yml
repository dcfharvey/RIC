name: WO88 active arbitration cutover

on:
  push:
    branches:
      - chatgpt/wo88-final-validation
    paths:
      - tools/wo88_arbitration_runtime_apply.py
      - .github/workflows/wo88-arbitration-runtime.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo88-final-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic cutover
        run: python tools/wo88_arbitration_runtime_apply.py
      - name: Compile generated code
        run: python -m compileall -q src tests
      - name: Install
        run: python -m pip install -e . pytest
      - name: Targeted arbitration/runtime tests
        run: >-
          python -m pytest -q
          tests/test_active_runtime_cutover.py
          tests/test_synthetic_causal_arbitration.py
          tests/test_synthetic_causal_arbitration_guards.py
          tests/test_action_arbitration_foundation.py
          tests/test_action_contract.py
          tests/test_mvp_preflight.py
      - name: Commit generated cutover
        shell: pwsh
        run: |
          git config user.name "RIC WO88 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "wo88e: activate neutral causal arbitration at exact boundaries"
          git push origin HEAD:chatgpt/wo88-final-validation
