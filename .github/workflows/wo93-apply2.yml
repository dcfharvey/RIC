name: Apply WO93 debloat
on:
  push:
    branches: [chatgpt/wo93-debloat-scaffolding]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo93-debloat-scaffolding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          def remove_defs(path, names):
              p=Path(path); text=p.read_text(encoding='utf-8'); lines=text.splitlines(keepends=True); tree=ast.parse(text)
              found=set(); ranges=[]
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)) and node.name in names:
                      found.add(node.name); start=node.lineno-1
                      while start>0 and lines[start-1].strip()=='': start-=1
                      ranges.append((start,node.end_lineno))
              if found != set(names): raise SystemExit(f'{path}: missing {sorted(set(names)-found)}')
              keep=[True]*len(lines)
              for a,b in ranges:
                  for i in range(a,b): keep[i]=False
              p.write_text(''.join(x for i,x in enumerate(lines) if keep[i]),encoding='utf-8')

          cli=Path('src/vivarium/cli.py')
          remove_defs(cli, {'_run_llm_smoke','_run_living_bench','_run_llm_calibration','_run_sleep_calibration_bench','_run_social_interpretation_bench','_run_llm_inventory','_run_social_interpretation_screen','_run_scene_smoke','_run_scene_bench'})
          text=cli.read_text(encoding='utf-8')
          a=text.index('    p_smoke = sub.add_parser('); b=text.index('    p_preflight = sub.add_parser(',a); text=text[:a]+text[b:]
          a=text.index('    if args.command == "llm-smoke":'); b=text.index('    if args.command == "mvp-preflight":',a); text=text[:a]+text[b:]
          cli.write_text(text,encoding='utf-8')

          t=Path('tests/test_cli.py')
          remove_defs(t, {'test_cli_screen_instantiates_real_scc_provider_without_network','test_cli_screen_default_report_namespace_is_stable','test_cli_screen_custom_reports_use_distinct_atomic_namespaces','test_cli_llm_smoke_reports_a_healthy_ephemeral_run','test_cli_llm_calibrate_reports_a_healthy_ephemeral_series','test_cli_scene_smoke_reports_a_healthy_ephemeral_turn','test_cli_scene_bench_reports_a_healthy_ephemeral_conversation'})
          text=t.read_text(encoding='utf-8').replace('from vivarium.cognition import LocalLLMSettings\n','').replace('from vivarium.social_interpretation_provider import LMStudioSocialInterpretationProvider\n','')
          t.write_text(text,encoding='utf-8')

          s=Path('tests/test_scene_scheduler.py')
          remove_defs(s, {'Provider','test_scene_bench_is_ephemeral_and_stops_at_its_turn_bound'})
          text=s.read_text(encoding='utf-8')
          for line in ('from vivarium.cognition_policy import CognitionCallLimits\n','from vivarium.scene_bench import run_scene_bench\n','from vivarium.scene_turn import SceneTurnDecision\n'):
              text=text.replace(line,'')
          s.write_text(text,encoding='utf-8')
          PY
          git rm .github/workflows/local-llm-smoke.yml \
            src/vivarium/cognition_call_bench.py src/vivarium/cognition_smoke.py src/vivarium/home_field_audit.py \
            src/vivarium/living_bench.py src/vivarium/local_llm_calibration.py src/vivarium/scene_bench.py \
            src/vivarium/scene_turn_smoke.py src/vivarium/sleep_calibration.py src/vivarium/social_attribution_mini_bench.py \
            src/vivarium/social_interpretation_bench.py src/vivarium/circadian_shadow.py \
            tests/test_cognition_call_bench.py tests/test_cognition_smoke.py tests/test_home_field_audit.py \
            tests/test_living_bench.py tests/test_local_llm_calibration.py tests/test_scene_turn_smoke.py \
            tests/test_sleep_calibration.py tests/test_social_interpretation_bench.py tests/test_circadian_shadow.py
          git rm .github/workflows/wo93-apply.yml .github/workflows/wo93-apply2.yml
          git config user.name 'RIC debloat bot'
          git config user.email 'noreply@github.com'
          git add src/vivarium/cli.py tests/test_cli.py tests/test_scene_scheduler.py
          git diff --cached --check
          git commit -m 'refactor: remove retired qualification scaffolding'
          git push origin HEAD:chatgpt/wo93-debloat-scaffolding
