name: WO86 synthetic causal validation

on:
  push:
    branches:
      - chatgpt/wo86-synthetic-causal-guard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check 'pytest>=8'

      - name: Compile changed Python
        run: |
          python -m py_compile \
            src/vivarium/sleep_termination.py \
            src/vivarium/synthetic_sleep_integration.py \
            src/vivarium/synthetic_action_arbitration.py \
            tests/test_synthetic_sleep_integration.py \
            tests/test_synthetic_causal_arbitration.py \
            tests/test_migrations.py

      - name: Run targeted WO86 tests
        run: |
          python -m pytest -q \
            tests/test_migrations.py \
            tests/test_synthetic_action_arbitration.py \
            tests/test_synthetic_sleep_integration.py \
            tests/test_synthetic_causal_arbitration.py

      - name: Run full test suite
        run: python -m pytest -q
