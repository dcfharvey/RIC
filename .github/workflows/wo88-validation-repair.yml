name: WO88 prior-failures verification

on:
  push:
    branches:
      - chatgpt/wo88-final-validation
    paths:
      - .github/workflows/wo88-validation-repair.yml

permissions:
  contents: read

jobs:
  verify-seven:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo88-final-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Verify the seven prior failures only
        run: >-
          python -m pytest -q
          tests/test_cli.py::test_cli_llm_smoke_reports_a_healthy_ephemeral_run
          tests/test_cli.py::test_cli_llm_calibrate_reports_a_healthy_ephemeral_series
          tests/test_cli.py::test_cli_scene_smoke_reports_a_healthy_ephemeral_turn
          tests/test_cli.py::test_cli_scene_bench_reports_a_healthy_ephemeral_conversation
          tests/test_synthetic_sleep_integration.py::test_checkpoint_completes_sleep_once_and_exposes_rearbitration_boundary
          tests/test_synthetic_sleep_integration.py::test_direct_sleep_completion_without_authorization_rolls_back_canonical_mutation
          tests/test_synthetic_sleep_integration.py::test_critical_stability_interrupts_once_then_requires_a_new_arbitration_frame
