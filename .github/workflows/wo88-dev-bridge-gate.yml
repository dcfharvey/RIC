name: WO88 dev bridge gate

on:
  push:
    branches:
      - chatgpt/wo88-final-validation
    paths:
      - .github/workflows/wo88-dev-bridge-gate.yml
      - src/vivarium/dev_bridge.py
      - tests/test_dev_bridge.py

permissions:
  contents: read

jobs:
  windows-targeted:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wo88-final-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Reproduce process tree timeout
        run: python -m pytest -vv -s tests/test_dev_bridge.py::test_process_tree_cancel_and_timeout_kill_descendants
