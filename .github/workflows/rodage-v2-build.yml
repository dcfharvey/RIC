name: Rodage V2 disposable build

on:
  push:
    branches:
      - chatgpt/rodage-v2-bootstrap-build
    paths:
      - tools/rodage_v2_apply.py
      - tools/rodage_v2_fix.py
      - src/vivarium/rodage_v2.py
      - tests/test_rodage_v2.py
      - .github/workflows/rodage-v2-build.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rodage-v2-bootstrap-build
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patches
        run: |
          python tools/rodage_v2_apply.py
          python tools/rodage_v2_fix.py
      - name: Install
        run: python -m pip install -e . pytest
      - name: Targeted tests
        run: >-
          python -m pytest -q
          tests/test_rodage_v2.py
          tests/test_initial_residence.py
          tests/test_environment_blueprints.py
          tests/test_activities.py
          tests/test_action_options.py
          tests/test_mvp_preflight.py
          tests/test_physiology_activation.py
          tests/test_non_sapient.py
          tests/test_resources.py
          tests/test_character_possession.py
      - name: Commit generated candidate
        shell: pwsh
        run: |
          git config user.name "RIC Rodage V2 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "rodage-v2: generated asymmetric bootstrap candidate"
          git push origin HEAD:chatgpt/rodage-v2-bootstrap-build
