name: OIDC trusted workflow POC

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print bounded non-secret OIDC claim shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          audience = "ric-dev-bridge"
          base = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          separator = "&" if "?" in base else "?"
          url = base + separator + urllib.parse.urlencode({"audience": audience})
          request = urllib.request.Request(url, headers={"Authorization": f"bearer {token}"})
          with urllib.request.urlopen(request, timeout=30) as response:
              oidc = json.loads(response.read().decode("utf-8"))["value"]
          parts = oidc.split(".")
          if len(parts) != 3:
              raise RuntimeError("unexpected JWT format")
          payload = parts[1] + "=" * (-len(parts[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload).decode("utf-8"))
          shape = {
              "jti_present": isinstance(claims.get("jti"), str) and bool(claims.get("jti")),
              "jti_length": len(claims.get("jti", "")) if isinstance(claims.get("jti"), str) else 0,
              "repository_visibility": claims.get("repository_visibility"),
              "job_workflow_sha_present": isinstance(claims.get("job_workflow_sha"), str),
              "workflow_ref_present": isinstance(claims.get("workflow_ref"), str),
          }
          print("OIDC_SHAPE=" + json.dumps(shape, sort_keys=True, separators=(",", ":")))
          PY
